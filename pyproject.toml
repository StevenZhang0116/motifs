[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motif-cumulants"
version = "0.8.0"
description = "Path cumulants, SONET motifs, directed triads, triplet motif probabilities, null models, and network response times"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
sparse = ["scipy>=1.9"]
dynamics = ["scipy>=1.9"]
test = ["pytest>=7", "scipy>=1.9", "networkx>=3"]

[tool.setuptools]
packages = ["motif_cumulants"]
